<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Go-LIVE reminder card</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --page-bg: #f3f3f5; --panel-bg: #fff; --text-1: #161823; --text-2: rgba(22,24,35,.64);
    --line: rgba(22,24,35,.12); --code-bg: #f7f7f9;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page-bg: #0d0d0f; --panel-bg: #1b1b1f; --text-1: #f2f2f4; --text-2: rgba(255,255,255,.62);
      --line: rgba(255,255,255,.14); --code-bg: #131316; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --page-bg: #0d0d0f; --panel-bg: #1b1b1f; --text-1: #f2f2f4; --text-2: rgba(255,255,255,.62);
    --line: rgba(255,255,255,.14); --code-bg: #131316; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--page-bg); color: var(--text-1);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Helvetica Neue", Arial, sans-serif; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--text-2); font-size: 13px; margin: 0 0 18px; line-height: 1.6; }
  .layout { display: grid; grid-template-columns: 390px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 880px) { .layout { grid-template-columns: 1fr; } }
  .panel { background: var(--panel-bg); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .panel h2 { font-size: 14px; margin: 0 0 12px; }
  .seg { display: flex; gap: 8px; flex-wrap: wrap; }
  .seg button { flex: 1; min-width: 84px; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: transparent; color: var(--text-1); font-size: 13px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: #fe2c55; border-color: #fe2c55; color: #fff; }
  pre { margin: 0; padding: 12px; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px;
    font-size: 12px; line-height: 1.55; overflow-x: auto; color: var(--text-1);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .rules { margin: 0; padding-left: 18px; font-size: 13px; color: var(--text-2); line-height: 1.75; }
  .rules b { color: var(--text-1); }

  /* ===== phone ===== */
  .phone { width: 100%; max-width: 430px; height: 100vh; margin: 0 auto; border-radius: 0; border: 0;
    background: #121212; position: relative; overflow: hidden; color: #f6f6f6; }
  .bgfx { position: absolute; inset: 0 0 auto 0; height: 70%; pointer-events: none;
    background: linear-gradient(158deg, #220202 7.72%, #6E0A0C 30.22%, #CB121A 75.44%); }
  .nav { position: absolute; top: 0; left: 0; right: 0; height: 44px; z-index: 20; display: flex; align-items: center;
    justify-content: space-between; padding: 0 12px; font-size: 13px; font-weight: 700; transition: background .15s; }
  .nav span { font-size: 18px; }
  .scroll { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; z-index: 10; overscroll-behavior: none; scrollbar-width: none; }
  .scroll::-webkit-scrollbar { display: none; }
  .hero { padding: 72px 16px 8px; text-align: center; }
  .hero .t { font-size: 28px; font-weight: 900; text-transform: uppercase; line-height: 1.07; }
  .hero .c { font-size: 12px; color: rgba(255,255,255,.78); margin-top: 8px; }
  .hero .c b { display: inline-block; min-width: 24px; padding: 2px 4px; margin: 0 4px; border-radius: 4px; background: rgba(0,0,0,.16); }
  .ms { margin: 20px 16px 28px; padding: 16px; border-radius: 12px; background: rgba(0,0,0,.1);
    border: 1px solid rgba(0,0,0,.08); backdrop-filter: blur(6px); }
  .ms-row { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
  .ph { flex: 0 0 92px; height: 72px; border-radius: 8px; background: rgba(0,0,0,.1); padding: 8px; text-align: center;
    cursor: pointer; display: flex; flex-direction: column; color: rgba(255,255,255,.6); }
  .ph small { font-size: 10px; font-weight: 600; }
  .ph div { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; line-height: 1.3; }
  .ph.sel { background: #fff; color: rgba(0,0,0,.65); }
  .ph.sel.cur { color: #C51324; }
  .guide { display: flex; gap: 8px; margin-top: 14px; font-size: 13px; line-height: 1.4; color: rgba(255,255,255,.88); }
  .tabs-wrap { position: sticky; top: 44px; z-index: 12; background: #121212; padding: 12px 12px 8px; border-radius: 32px 32px 0 0; }
  .tabs { display: flex; height: 52px; border-radius: 999px; padding: 4px; gap: 1px; background: rgba(255,255,255,.08); }
  .tabs button { flex: 1; border: 0; border-radius: 999px; background: transparent; color: rgba(255,255,255,.5);
    font-size: 15px; font-weight: 700; cursor: pointer; transition: all .25s; }
  .tabs button.on { background: #C51324; color: #fff; }
  .content { background: #121212; padding: 0 16px 28px; min-height: 420px; }
  h3 { font-size: 18px; font-weight: 700; margin: 16px 0 8px; }

  /* ===== the new card ===== */
  .live-card { display: flex; flex-direction: column; gap: 12px; padding: 16px; margin: 16px 0;
    border-radius: 12px; background: rgba(255,255,255,.08); border: .5px solid rgba(255,255,255,.12); }
  .live-card.flash { outline: 2px dashed #ffd24a; outline-offset: 3px; }
  .live-card .title { font-size: 17px; font-weight: 700; }
  .row { display: flex; align-items: center; gap: 8px; }
  .av { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid #3a3a3a; }
  .av + .av { margin-left: -10px; }
  .reg { font-size: 13px; color: rgba(255,255,255,.64); }
  .cta { width: 100%; height: 40px; border: 0; border-radius: 8px; font-size: 15px; font-weight: 600; }
  .cta.primary { background: #fe2c55; color: #fff; cursor: pointer; }
  .cta.secondary { background: rgba(255,255,255,.12); color: rgba(255,255,255,.34); cursor: not-allowed; }
  .tag-new { display: inline-block; font-size: 10px; color: #ffd24a; margin-bottom: 4px; }

  .banner { aspect-ratio: 1074/315; border-radius: 8px; box-shadow: 0 2px 2px rgba(0,0,0,.25);
    background: linear-gradient(120deg, #ff5a36, #c51324 60%, #6e0a0c); display: flex; align-items: center;
    padding: 0 18px; font-weight: 900; font-size: 20px; text-transform: uppercase; margin: 16px 0 6px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0; scrollbar-width: none; }
  .chip { flex: none; padding: 7px 12px; border-radius: 8px; font-size: 13px; background: rgba(255,255,255,.08); color: #f6f6f6; }
  .chip.sel { background: #fff; color: #161823; }
  .act { padding: 16px; border-radius: 12px; background: rgba(255,255,255,.08); border: .5px solid rgba(255,255,255,.12); margin-bottom: 12px; }
  .act .k { font-size: 11px; color: rgba(255,255,255,.5); }
  .act .h { font-size: 15px; font-weight: 600; margin-top: 4px; }
  .act .s { font-size: 13px; color: rgba(255,255,255,.64); margin-top: 2px; }
  .cats { display: flex; gap: 20px; overflow-x: auto; padding: 8px 0 20px; scrollbar-width: none; }
  .cat { flex: none; width: 64px; text-align: center; font-size: 12px; font-weight: 600; }
  .cat i { display: block; width: 64px; height: 64px; border-radius: 50%; background: #f2f2f2; margin-bottom: 8px; }
  .prods { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; }
  .prod { flex: none; width: 150px; }
  .prod i { display: block; width: 150px; height: 150px; border-radius: 8px; background: rgba(255,255,255,.1); margin-bottom: 6px; }
  .prod span { font-size: 12px; color: rgba(255,255,255,.7); }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    background: #111; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 13px; opacity: 0;
    transition: opacity .2s; pointer-events: none; max-width: 90vw; z-index: 99; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="phone">
        <div class="bgfx"></div>
        <div class="nav" id="nav"><span>‹</span><b>BFCM · Creator Hub</b><span>ⓘ&nbsp;⤴</span></div>
        <div class="scroll" id="scroll">
          <div class="hero">
            <div class="t">Black Friday &amp;<br>Cyber Monday</div>
            <div class="c">Ends in <b>05</b>d<b>12</b>h<b>30</b>m</div>
          </div>
          <div class="ms">
            <div class="ms-row" id="phases"></div>
            <div class="guide"><span>💡</span><span id="guide"></span></div>
          </div>
          <div class="tabs-wrap"><div class="tabs" id="tabs">
            <button data-t="p">🛍 Marketplace</button>
            <button data-t="c" class="on">📣 Campaigns</button>
          </div></div>
          <div class="content" id="content"></div>
        </div>
      </div>
    
<div class="toast" id="toast"></div>
<script>
  var AV = ['linear-gradient(135deg,#ff9a9e,#fad0c4)', 'linear-gradient(135deg,#a18cd1,#fbc2eb)'];
  var two = [{url_list:['a']},{url_list:['b']}];
  var MOCKS = {
    far:  { code:0, message:'success',
      live_session_data:[{ id:'session_123', start_time:'1732118400', subscriber_count:'1700', avatar_thumbs:two }],
      module_info:{ title:'Next LIVE: Nov 20, 7:00PM', subtitle:'', button_text:'Prepare', button_status:0 } },
    today:{ code:0, message:'success',
      live_session_data:[{ id:'session_456', start_time:'1731974400', subscriber_count:'2300', avatar_thumbs:two }],
      module_info:{ title:'Go LIVE today at 7:00PM', subtitle:'', button_text:'Go LIVE', button_status:1 } },
    zero: { code:0, message:'success',
      live_session_data:[{ id:'session_789', start_time:'1732118400', subscriber_count:'0', avatar_thumbs:[] }],
      module_info:{ title:'Next LIVE: Nov 22, 8:00PM', subtitle:'', button_text:'Prepare', button_status:0 } },
    empty:{ code:0, message:'success', live_session_data:[],
      module_info:{ title:'', subtitle:'', button_text:'', button_status:0 } }
  };
  var PHASES = [
    { d:'Nov 1 – 13', t:'Warm-up', g:'Register for Key Livestreams and add products to your showcase.' },
    { d:'Nov 14 – 20', t:'Early Access', g:'Schedule your LIVE and share the preview with your followers.' },
    { d:'Nov 21 – 27', t:'BFCM', g:'Go LIVE on time — reservations boost your reach.' },
    { d:'Nov 28 – Dec 2', t:'Cyber Week', g:'Keep the momentum with short videos and bundles.' }
  ];
  var CUR = 2, selPhase = CUR, tab = 'c', mock = 'far';

  function fmt(n) { return n >= 1000 ? (n / 1000).toFixed(1) + 'K' : String(n); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function toast(m) { var t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); setTimeout(function(){ t.classList.remove('show'); }, 2000); }

  function liveCard(res) {
    if (!res || res.code !== 0 || !res.live_session_data || !res.live_session_data.length) return '';
    var s = res.live_session_data[0], m = res.module_info;
    var n = parseInt(s.subscriber_count, 10), show = n > 0;
    var avs = show && s.avatar_thumbs && s.avatar_thumbs.length ? s.avatar_thumbs.slice(0, 2) : [];
    var go = m.button_status === 1;
    var h = '<div class="live-card flash" id="lc"><div class="title">' + esc(m.title) + '</div>';
    if (show) {
      h += '<div class="row">' + avs.map(function (_, i) { return '<span class="av" style="background:' + AV[i % 2] + '"></span>'; }).join('') +
        '<span class="reg">' + fmt(n) + ' registered</span></div>';
    }
    h += '<button class="cta ' + (go ? 'primary' : 'secondary') + '" id="cta"' + (go ? '' : ' disabled') + '>' + esc(m.button_text) + '</button></div>';
    return h;
  }

  function renderContent() {
    var c = document.getElementById('content');
    if (tab === 'c') {
      c.innerHTML = liveCard(MOCKS[mock]) +
        '<div class="banner">Cyber Week<br>Creator Boost</div>' +
        '<h3>All Black Friday activities</h3>' +
        '<div class="chips"><span class="chip">⚙ Filter</span><span class="chip">Joined</span><span class="chip">Home &amp; Electronics</span><span class="chip">Beauty &amp; Lifestyle</span><span class="chip">Fashion</span></div>' +
        '<div class="act"><div class="k">CHALLENGE · Video GMV</div><div class="h">2025 Fall Sale | Creator Video Clash</div><div class="s">Win up to $1200 cash · 2113 joined</div></div>' +
        '<div class="act"><div class="k">TASK · Promotion task</div><div class="h">Go LIVE 3 times</div><div class="s">View all requirements</div></div>' +
        '<div class="act"><div class="k">CAMPAIGN · Featured LIVE</div><div class="h">Register a LIVE to get extra promotion support</div><div class="s">Nov 14 – Nov 27</div></div>';
      var cta = document.getElementById('cta');
      if (cta && !cta.disabled) cta.onclick = function () {
        toast('Opens the LIVE shopping bag (demo)');
      };
    } else {
      c.innerHTML = '<h3>Shop by category</h3><div class="cats">' +
        ['Home','Beauty','Wellness','Fashion','More'].map(function (x) { return '<div class="cat"><i></i>' + x + '</div>'; }).join('') +
        '</div><h3>Get free samples with points</h3><div class="prods">' +
        [1,2,3].map(function (i) { return '<div class="prod"><i></i><span>Product ' + i + '</span></div>'; }).join('') + '</div>';
    }
  }

  function renderPhases() {
    document.getElementById('phases').innerHTML = PHASES.map(function (p, i) {
      return '<div class="ph' + (i === selPhase ? ' sel' : '') + (i === CUR ? ' cur' : '') + '" data-i="' + i + '"><small>' + p.d + '</small><div>' + p.t + '</div></div>';
    }).join('');
    document.getElementById('guide').textContent = PHASES[selPhase].g;
  }


  window.setState = function (k) {
    mock = k; tab = 'c';
    Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function (b) { b.className = b.getAttribute('data-t') === 'c' ? 'on' : ''; });
    renderContent();
    document.getElementById('scroll').scrollTo({ top: 300, behavior: 'smooth' });
  };
  document.getElementById('tabs').addEventListener('click', function (e) {
    var t = e.target.getAttribute && e.target.getAttribute('data-t'); if (!t) return;
    tab = t;
    Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function (b) { b.className = b.getAttribute('data-t') === t ? 'on' : ''; });
    renderContent();
  });
  document.getElementById('phases').addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('.ph') : null; if (!el) return;
    selPhase = parseInt(el.getAttribute('data-i'), 10); renderPhases();
  });
  // navbar background fades in with scroll
  var sc = document.getElementById('scroll');
  sc.addEventListener('scroll', function () {
    var o = Math.min(sc.scrollTop / 400, 1);
    document.getElementById('nav').style.background = 'rgba(18,18,18,' + o + ')';
  });

  renderPhases(); renderContent();
</script>
</body>
</html>
